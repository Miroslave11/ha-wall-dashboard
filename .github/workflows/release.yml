# Vydání: po pushnutí tagu vX.Y.Z se sestaví Docker image a nahraje do GitHub Container Registry
# (ghcr.io/<vlastník>/ha-wall-dashboard). NAS si ho stáhne skriptem deploy/synology/aktualizace.sh.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Název image a verze
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$image:$version,$image:latest"
          else
            # ruční spuštění z větve: jen testovací tag, :latest (a tím NAS) se nemění
            version="dev-${GITHUB_SHA::7}"
            tags="$image:$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 = Synology s Intel/AMD (řady +, xs), arm64 = novější ARM modely
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kontrola image (nastartuje, vrací verzi a stránku)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
          docker run -d --name smoke -p 8080:80 "$image"
          sleep 3
          test "$(curl -fsS http://localhost:8080/version.txt)" = "${{ steps.meta.outputs.version }}"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/config.json > /dev/null
          docker rm -f smoke

      - name: Soubory pro NAS k vydání
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd deploy/synology
          zip -r ../../ha-wall-dashboard-synology.zip . -x '*.local.json'
          cd ../..
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ha-wall-dashboard-synology.zip --clobber
