server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Konfigurace a číslo verze se nesmí cachovat – po úpravě stačí obnovit stránku na tabletu,
    # podle version.txt se tablet po aktualizaci obnoví sám
    location ~ ^/(config(\.local)?\.json|version\.txt)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Sestavené soubory mají hash v názvu → můžou se cachovat napořád
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fotky pro fotorámeček (složka z NASu připojená jako volume /photos).
    # Výpis adresáře v JSON čte aplikace (photoFrame.source.type = "autoindex").
    location /photos/ {
        alias /photos/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Immich (photoFrame.source.type = "immich"). Proxy jen pro čtení alb a náhledů,
    # API klíč se doplňuje tady, takže není v konfiguraci ani v prohlížeči.
    # IMMICH_URL a IMMICH_API_KEY se dosazují při startu kontejneru (docker-compose.yml).
    location ~ ^/immich/(api/albums(/[0-9a-fA-F-]+)?|api/assets/[0-9a-fA-F-]+/thumbnail)$ {
        limit_except GET { deny all; }
        rewrite ^/immich/(.*)$ /$1 break;
        proxy_pass ${IMMICH_URL};
        proxy_set_header x-api-key "${IMMICH_API_KEY}";
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Seznam fotek alba (Immich 2.x+): POST vyhledávání, vyžaduje oprávnění klíče asset.read
    location = /immich/api/search/metadata {
        limit_except POST { deny all; }
        rewrite ^/immich/(.*)$ /$1 break;
        proxy_pass ${IMMICH_URL};
        proxy_set_header x-api-key "${IMMICH_API_KEY}";
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
